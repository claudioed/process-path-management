services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathmgmt
      POSTGRES_PASSWORD: pathmgmt
      POSTGRES_DB: pathmgmt
    ports:
      - "5436:5432"
    volumes:
      - pathmgmt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathmgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pathmgmt_pg_data:
