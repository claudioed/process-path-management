openapi: 3.0.3
info:
  title: Process Path Management API
  description: >
    Operator-configurable process-path catalogue: canonical identity, the
    matchPrefix rule downstream consumers use to resolve a caller-supplied
    id to a path family, and the capabilities a station/associate must hold
    to work that path. This service replaces what was, before it existed, a
    static YAML file (warehouse-infra/config/process-paths/sortable-fc.yaml)
    loaded once at boot by fulfillment-execution, wes-work-planning, and
    workforce-management. It is the SOURCE of the process-path published
    language, never a consumer of anyone else's — every change here is
    propagated onward exclusively via Kafka (see apis/asyncapi.yaml), never
    through a synchronous callback into this service.
  version: "1.0.0"
  license:
    name: MIT
  contact:
    name: Process Path Management Team
    url: https://github.com/claudioed/process-path-management
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: process-paths
    description: Define, revise, retrieve, list, and deactivate process paths
  - name: health
    description: Liveness probe
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      description: Reports whether the service process is up and able to serve requests.
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /process-paths:
    post:
      tags: [process-paths]
      operationId: definePath
      summary: Define a brand-new process path
      description: >
        Rejects with 409 if the given pathId is already defined — active or
        deactivated. A path's identity is permanent once created; a caller
        wanting to re-use an id after deactivation must be told explicitly,
        never silently overwritten. Publishes ProcessPathCreated on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefineProcessPathRequest"
      responses:
        "201":
          description: Path defined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessPath"
        "409":
          description: A process path with this id already exists (active or deactivated)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: matchPrefix is empty/not lower-case, or requiredCapabilities is empty
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      tags: [process-paths]
      operationId: listPaths
      summary: List process paths
      description: >
        Returns only Active paths by default — matching the retired YAML
        catalogue's own posture that every consumer's normal read is "the
        currently valid set," not everything that ever existed. Pass
        ?all=true for the audit view (Active and Deactivated paths).
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, includes Deactivated paths too.
      responses:
        "200":
          description: The requested set of process paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessPath"
  /process-paths/{pathId}:
    get:
      tags: [process-paths]
      operationId: getPath
      summary: Get one process path by id
      description: Returns the path regardless of status (Active or Deactivated).
      parameters:
        - $ref: "#/components/parameters/PathIdPathParam"
      responses:
        "200":
          description: The requested process path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessPath"
        "404":
          description: No process path exists with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    put:
      tags: [process-paths]
      operationId: revisePath
      summary: Revise an Active process path's matchPrefix/requiredCapabilities
      description: >
        pathId and direct are not revisable (direct describes a structural
        routing fact, not an operator-tunable parameter). Returns 422 if the
        path is Deactivated — a deactivated path is a closed historical
        record. A no-op revision (identical matchPrefix and
        requiredCapabilities) is a successful 200 that does NOT republish
        ProcessPathUpdated.
      parameters:
        - $ref: "#/components/parameters/PathIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisePathRequest"
      responses:
        "200":
          description: Path revised (or unchanged, if the request was a no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessPath"
        "404":
          description: No process path exists with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: The path is deactivated, or matchPrefix/requiredCapabilities is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      tags: [process-paths]
      operationId: deactivatePath
      summary: Deactivate (retire) a process path
      description: >
        Idempotent: deactivating an already-deactivated path is a no-op
        success and does NOT republish ProcessPathDeactivated. Publishes
        ProcessPathDeactivated the first time a path transitions to
        Deactivated. This service takes no position on work already
        assigned to this path in a downstream context — that is each
        consumer's own operational concern.
      parameters:
        - $ref: "#/components/parameters/PathIdPathParam"
      responses:
        "204":
          description: Path deactivated (or already was)
        "404":
          description: No process path exists with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  parameters:
    PathIdPathParam:
      name: pathId
      in: path
      required: true
      schema:
        type: string
      example: PICK
  schemas:
    DefineProcessPathRequest:
      type: object
      required: [pathId, matchPrefix, requiredCapabilities]
      properties:
        pathId:
          type: string
          description: The canonical identity of the path (e.g. "PICK", "PACK", "REBIN", "SLAM").
          example: PICK
        matchPrefix:
          type: string
          description: >
            Lower-case prefix downstream consumers match a caller-supplied
            id against: id == matchPrefix OR id starts with
            matchPrefix + "-". Must be non-empty and lower-case.
          example: pick
        direct:
          type: boolean
          default: false
          description: >
            A structural fact about this path's routing shape (reserved for
            a future multi-hop topology). Immutable once set; not revisable.
        requiredCapabilities:
          type: array
          minItems: 1
          items:
            type: string
          description: Capabilities a station/associate must hold to work this path.
          example: ["pick"]
    RevisePathRequest:
      type: object
      required: [matchPrefix, requiredCapabilities]
      properties:
        matchPrefix:
          type: string
          example: pick-zone-a
        requiredCapabilities:
          type: array
          minItems: 1
          items:
            type: string
          example: ["pick", "hazmat"]
    ProcessPath:
      type: object
      properties:
        pathId:
          type: string
          example: PICK
        matchPrefix:
          type: string
          example: pick
        direct:
          type: boolean
        requiredCapabilities:
          type: array
          items:
            type: string
          example: ["pick"]
        status:
          type: string
          enum: [ACTIVE, DEACTIVATED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details for HTTP APIs.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required: [type, title, status, detail]
