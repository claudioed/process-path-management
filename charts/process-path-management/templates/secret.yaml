{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "process-path-management.databaseSecretName" . }}
  labels:
    {{- include "process-path-management.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
{{- if and (or .Values.auth.readKey .Values.auth.readWriteKey) (not .Values.auth.existingSecret) }}
---
# REST auth keys (ADR 0004). Each key is rendered only when set, so a
# blank value can never authorize anyone.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "process-path-management.authSecretName" . }}
  labels:
    {{- include "process-path-management.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.readKey }}
  API_READ_KEY: {{ .Values.auth.readKey | quote }}
  {{- end }}
  {{- if .Values.auth.readWriteKey }}
  API_READWRITE_KEY: {{ .Values.auth.readWriteKey | quote }}
  {{- end }}
{{- end }}
